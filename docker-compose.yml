services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gym_os
      POSTGRES_USER: gym_os
      POSTGRES_PASSWORD: ${GYM_LOCAL_DB_PASSWORD:?Set GYM_LOCAL_DB_PASSWORD for local development}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gym_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_os -d gym_os"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  gym_database:
